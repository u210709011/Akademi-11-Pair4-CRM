# PR dogrulamasi — UI test otomasyonu
#
# KAPSAM BILINCLI OLARAK DAR: burada tarayici acilmaz, uygulama ayaga kaldirilmaz.
# Sebep: uctan uca kosu 9 JVM + Docker altyapisi gerektiriyor; stack ~10 dk'da aciliyor,
# 59 senaryo ~25 dk suruyor. Her PR'da bunu beklemek gelistirmeyi yavaslatir ve
# altyapi kaynakli fla-kilik, gercek kod hatalarinin uzerini orter.
#
# Bu is akisi su sorulari yanitlar: "test kodu derleniyor mu, suite tanimlari
# gecerli mi, testler kesfedilebiliyor mu?" Gercek dogrulama gecelik regresyonda
# (ui-test-nightly.yml) yapilir.

name: UI Test — PR Check

on:
  pull_request:
    paths:
      - 'analiz-test/ui-test/**'
      - 'front-end/**'
      - '.github/workflows/ui-test-*.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: analiz-test/ui-test

jobs:
  compile:
    name: Derleme ve suite dogrulamasi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Test kaynaklarini derle
        run: ./mvnw -B clean test-compile

      # Suite XML'lerindeki sinif adlari elle yazildigi icin, bir sinif yeniden
      # adlandirildiginda derleme GECER ama suite sessizce bos kalir. Bu adim
      # her <class name="..."/> girdisinin karsiligi olan .class dosyasini arar.
      - name: Suite XML'lerindeki sinif adlarini dogrula
        run: |
          status=0
          for xml in testng/*.xml; do
            while read -r fqcn; do
              path="target/test-classes/$(echo "$fqcn" | tr '.' '/').class"
              if [ ! -f "$path" ]; then
                echo "::error file=$xml::$xml -> sinif bulunamadi: $fqcn"
                status=1
              fi
            done < <(grep -oP '(?<=<class name=")[^"]+' "$xml")
          done
          exit $status
