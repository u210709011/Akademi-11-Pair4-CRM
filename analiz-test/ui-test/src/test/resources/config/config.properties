# ---------------------------------------------------------------------------
# Ortak varsayilanlar. Ortama ozel dosyalar (local/dev/test.properties) bu
# degerleri ezer; onlari da -D sistem parametreleri ve ortam degiskenleri ezer.
# ---------------------------------------------------------------------------

# Tarayici
browser=chrome
headless=false
window.width=1920
window.height=1080
# Bos birakilirsa yerel driver kullanilir; doluysa RemoteWebDriver (Grid/Docker)
remote.url=

# Bekleme sureleri (saniye)
timeout.explicit=15
timeout.short=5
timeout.long=45
# Angular dev-server modulleri istek uzerine derledigi icin ilk yuklemeler yavas olabilir.
timeout.pageload=60
# CI makineleri yavas oldugu icin orada 1.5-2.0 verilmesi onerilir
timeout.multiplier=1.0

# Uygulama davranisi
# FR-018 varsayilan dili Turkce diyor, kod ise 'en' ile basliyor.
# Gereksinim dokumanindaki hata mesajlari Ingilizce oldugu icin testler EN'e sabitlenir.
ui.language=en

# Cerceve davranisi
# Sadece altyapi hatalarinda (Timeout/StaleElement) yeniden dener; AssertionError ASLA denenmez.
retry.count=1
# all | failure | off
screenshot.mode=failure

# Tek bir WebDriver komutunun yanit bekleme siniri.
# Tarayici/chromedriver cokerse suite testler ARASINDA asili kalmasin diye sinirlidir
# (bkz. FrameworkConfig.commandTimeout). timeout.pageload degerinden buyuk olmalidir.
timeout.command=120
