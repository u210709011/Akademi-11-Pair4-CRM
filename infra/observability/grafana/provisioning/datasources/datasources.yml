apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    jsonData:
      derivedFields:
        # Log satirlarindaki traceId'yi Tempo'daki ilgili trace'e linkleyen
        # tiklanabilir bir alan olusturur (bkz. logback pattern: [%X{traceId}]).
        - datasourceUid: tempo
          matcherRegex: 'traceId[":=]+([a-f0-9]+)'
          name: TraceID
          url: '$${__value.raw}'
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prometheus
    editable: false
