# Tek node, dosya sistemi tabanli minimal Tempo konfigurasyonu - sunum/demo olcegi icin.
# OTLP receiver acik: Micrometer Tracing (OTel bridge) her servisten span'lari buraya
# gonderir (http :4318, grpc :4317).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
